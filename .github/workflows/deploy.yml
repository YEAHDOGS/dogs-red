name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble dist
        run: |
          mkdir dist
          tar --exclude='./dist' --exclude='./.git' --exclude='./.github' --exclude='./scripts' -cf - . | tar -xf - -C dist
      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler pages deploy dist --project-name=dogs-red
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8ec0025171fc3a4dbbefd7b9033a06b7
